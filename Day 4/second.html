<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .body{
            display: flex;
            justify-content: center;
            align-items: center;
            height:90vh;
            /* view height (vh) */
        }
        .outer{
            width:60%;
            border-radius: 20px;
            padding:5px ;
            display: flex;
            /* align-items: center;  for column*/
            /* justify-content: center; for row */
            justify-content: center;

            /* box-shadow: x-axis y-axis radius color */
            box-shadow: 0px 0px 15px rgb(0, 31, 42);
            text-shadow: 0px 0px 15px rgb(246, 9, 9);
        }
        .inner{
            border-radius: 20px;
            background-color: slateblue;
            text-align: center;

            width: 90%;
        }
    </style>
</head>
<body>
    <div class="body">

        <div class="outer">
            <div class="inner">
                hello i am inside the outer div.
            </div>
        </div>
    </div>
</body>
</html>
